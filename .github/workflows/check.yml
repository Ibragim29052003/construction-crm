name: Проверки
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Подготовить отдельную тестовую базу
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 -f tests/database/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d crm_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: npm run test:db
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/crm_test
